# ────────────────────────────────────────────────────────────────
# Ephemeral GitHub Actions runner fleet: one container per repo.
# All values are static; there is no .env file and no interpolation.
#
# The app key ships as a file-backed secret from
# /srv/secrets/runner/github-app.pem (owner root, mode 0600;
# procedure in README Part 2).
# CLIENT_ID and INSTALLATION_ID are placeholders for the dhuseby
# GitHub App; replace them with the real values before starting the
# fleet (procedure in README Part 2).
# ────────────────────────────────────────────────────────────────

secrets:
  github_app_key:
    file: /srv/secrets/runner/github-app.pem

# Shared shape for every runner service. The compose client mounts the secret
# read-only at /run/secrets/github_app_key. memory-limit 2g plus a swap
# allowance up to 6g turns a rare compile-memory spike into a slowdown
# instead of an oom-kill. security_opt disables SELinux/MCS labeling so the
# runner can drive the host Docker CLI through the mounted socket.
x-runner-common: &runner-common
  image: ghcr.io/dhuseby/runner:latest
  restart: unless-stopped
  secrets:
    - github_app_key
  security_opt:
    - label:disable
  mem_limit: '2g'
  memswap_limit: '6g'
  volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    - "/srv/cache:/srv/cache"

# Values every runner shares. RUNNER_NAME and REPO_URL differ per service.
# RUNNER_ALLOW_RUNASROOT stays in the image environment; the entrypoint always
# passes --ephemeral and --disableupdate to config.sh, so no compose variables
# for those exist.
x-runner-env: &runner-env
  RUNNER_SCOPE: 'repo'
  CLIENT_ID: 'Iv1.0000000000000000'
  INSTALLATION_ID: '0000000'
  LABELS: 'self-hosted,linux,x64,ephemeral'

services:
  cruzr:
    <<: *runner-common
    container_name: cruzr-r1
    environment:
      <<: *runner-env
      RUNNER_NAME: cruzr-r1
      REPO_URL: https://github.com/dhuseby/cruzr

  denyfs:
    <<: *runner-common
    container_name: denyfs-r1
    environment:
      <<: *runner-env
      RUNNER_NAME: denyfs-r1
      REPO_URL: https://github.com/dhuseby/denyfs

  gold-vault:
    <<: *runner-common
    container_name: gold-vault-r1
    environment:
      <<: *runner-env
      RUNNER_NAME: gold-vault-r1
      REPO_URL: https://github.com/dhuseby/gold-vault

  wide-log:
    <<: *runner-common
    container_name: wide-log-r1
    environment:
      <<: *runner-env
      RUNNER_NAME: wide-log-r1
      REPO_URL: https://github.com/dhuseby/wide-log

  # To add a repo: install the dhuseby GitHub App on that repo, add a
  # service block of this shape, and run docker compose up -d. The full
  # procedure is README Part 5.
