      REPO_URL: https://github.com/cryptidtech/wacc

  # To add a repo: install the GitHub App on that repo, add or uncomment a
  # service block of this shape, and run docker compose up -d. The full
  # procedure is README Part 5. multi-proof stays commented out until the
