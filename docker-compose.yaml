# ────────────────────────────────────────────────────────────────
# Ephemeral GitHub Actions runner fleet: one container per repo.
# All values are static; there is no .env file and no interpolation.
#
# The app key ships as a file-backed secret from
# /srv/secrets/multi-runner/github-app.pem (owner root, mode 0600;
# procedure in README Part 2).
# CLIENT_ID and INSTALLATION_ID are placeholders until the GitHub App exists;
# replace them with the real values before starting the fleet
# (procedure in README Part 2).
# ────────────────────────────────────────────────────────────────

secrets:
  github_app_key:
    file: /srv/secrets/multi-runner/github-app.pem

# Shared shape for every runner service. The compose client mounts the secret
# read-only at /run/secrets/github_app_key. memory-limit 3g plus a swap
# allowance up to 6g turns a rare compile-memory spike into a slowdown
# instead of an oom-kill. security_opt disables SELinux/MCS labeling so the
# runner can drive the host Docker CLI through the mounted socket.
x-runner-common: &runner-common
  image: ghcr.io/cryptidtech/multi-runner:latest
  restart: unless-stopped
  secrets:
    - github_app_key
  security_opt:
    - label:disable
  mem_limit: '2g'
  memswap_limit: '6g'
  volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
    - "/srv/cache:/srv/cache"

# Values every runner shares. RUNNER_NAME and REPO_URL differ per service.
# RUNNER_ALLOW_RUNASROOT stays in the image environment; the entrypoint always
# passes --ephemeral and --disableupdate to config.sh, so no compose variables
# for those exist.
x-runner-env: &runner-env
  RUNNER_SCOPE: 'repo'
  CLIENT_ID: 'Iv23litJSwRvnOrbxOZI'
  INSTALLATION_ID: '179023609'
  LABELS: 'self-hosted,linux,x64,ephemeral'

services:
  multi-base:
    <<: *runner-common
    container_name: multi-base-r1
    environment:
      <<: *runner-env
      RUNNER_NAME: multi-base-r1
      REPO_URL: https://github.com/cryptidtech/multi-base

  multi-cbor:
    <<: *runner-common
    container_name: multi-cbor-r1
    environment:
      <<: *runner-env
      RUNNER_NAME: multi-cbor-r1
      REPO_URL: https://github.com/cryptidtech/multi-cbor

  multi-cid:
